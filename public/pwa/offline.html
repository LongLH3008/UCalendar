<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#faf3ed" />
    <title>Offline | UCalendar</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #faf3ed; color: #292524; font-family: system-ui, sans-serif; }
      main { max-width: 28rem; padding: 2rem; text-align: center; }
      p { line-height: 1.6; }
      button { border: 0; border-radius: .75rem; padding: .8rem 1.4rem; background: #292524; color: white; font: inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>UCalendar needs an internet connection to load this page. Check your connection and try again.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
    <script>
      let locale = document.cookie.split("; ").find(entry => entry.startsWith("locale="))?.slice(7);
      try { locale = localStorage.getItem("ucalendar.locale") || locale; } catch { /* Storage may be unavailable. */ }
      if (locale === "vi") {
        document.documentElement.lang = "vi";
        document.title = "Mất kết nối | UCalendar";
        document.querySelector("h1").textContent = "Bạn đang mất kết nối";
        document.querySelector("p").textContent = "UCalendar cần kết nối mạng để tải trang này. Hãy kiểm tra kết nối rồi thử lại.";
        document.querySelector("button").textContent = "Thử lại";
      }
    </script>
  </body>
</html>
