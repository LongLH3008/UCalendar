<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#faf3ed" />
    <title>Mất kết nối | UCalendar</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #faf3ed; color: #292524; font-family: system-ui, sans-serif; }
      main { max-width: 28rem; padding: 2rem; text-align: center; }
      p { line-height: 1.6; }
      button { border: 0; border-radius: .75rem; padding: .8rem 1.4rem; background: #292524; color: white; font: inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>Bạn đang mất kết nối</h1>
      <p>UCalendar cần kết nối mạng để tải trang này. Hãy kiểm tra kết nối rồi thử lại.</p>
      <button type="button" onclick="window.location.reload()">Thử lại</button>
    </main>
  </body>
</html>
